<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1c1917"/>

  <!--
    M built from identical 4×4 px blocks on a 5px grid.
    5 columns wide, 10 rows tall, centered in 64px canvas.
    Origin: x=7, y=7. Column offsets: 0,10,20,30,40 → x=7,17,27,37,47

    Row 0: 1 . . . 1
    Row 1: 1 1 . 1 1
    Row 2: 1 . 1 . 1   ← amber (peak)
    Row 3: 1 . . . 1
    Row 4: 1 . . . 1
    Row 5: 1 . . . 1
    Row 6: 1 . . . 1
    Row 7: 1 . . . 1
    Row 8: 1 . . . 1
    Row 9: 1 . . . 1
  -->

  <!-- Row 0 -->
  <rect x="7"  y="7"  width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="7"  width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 1 -->
  <rect x="7"  y="12" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="17" y="12" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="37" y="12" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="12" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 2 (peak — amber) -->
  <rect x="7"  y="17" width="4" height="4" rx="0.5" fill="#d97706"/>
  <rect x="27" y="17" width="4" height="4" rx="0.5" fill="#d97706"/>
  <rect x="47" y="17" width="4" height="4" rx="0.5" fill="#d97706"/>
  <!-- Row 3 -->
  <rect x="7"  y="22" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="22" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 4 -->
  <rect x="7"  y="27" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="27" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 5 -->
  <rect x="7"  y="32" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="32" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 6 -->
  <rect x="7"  y="37" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="37" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 7 -->
  <rect x="7"  y="42" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="42" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 8 -->
  <rect x="7"  y="47" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="47" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <!-- Row 9 -->
  <rect x="7"  y="52" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
  <rect x="47" y="52" width="4" height="4" rx="0.5" fill="#f5f0eb"/>
</svg>
